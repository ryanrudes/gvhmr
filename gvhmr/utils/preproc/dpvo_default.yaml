### DPVO Config File ###
# Vendored verbatim from DPVO's config/default.yaml so the SLAM backend works with a pip/uv-installed
# `dpvo` (the upstream config/ dir is not part of the installed package). See gvhmr/utils/preproc/slam.py.

# VO config (increase for better accuracy)
PATCHES_PER_FRAME: 96
REMOVAL_WINDOW: 22
OPTIMIZATION_WINDOW: 10
PATCH_LIFETIME: 13

# threshold for keyframe removal
KEYFRAME_THRESH: 15.0

# camera motion model
MOTION_MODEL: 'DAMPED_LINEAR'
MOTION_DAMPING: 0.5

# maybe use mixed precision for inference
MIXED_PRECISION: True

CENTROID_SEL_STRAT: 'RANDOM'
