# @package _global_
# ROADMAP Regime B, stage 3 — JOINT backbone training. Instead of the cached HMR2 features, run HMR2 +
# LoRA on raw crops each step so the backbone learns THIS task (the real source of HMR2's edge over a
# frozen swap — ROADMAP A1). Scoped to 3DPW-train (crops-serving) to answer, cheaply, "does a task-trained
# LoRA backbone beat frozen HMR2 features?" before committing to full-BEDLAM-scale data plumbing.
#
# Controlled A/B: the FROZEN baseline is this file with pipeline.args.joint_backbone.enabled=False and
# train_datasets/imgfeat_3dpw=v1 (cached features) — same data, same recipe, only the backbone differs.
# LoRA is zero-init so the joint arm STARTS numerically identical to the frozen arm; any gap is learning.
#
# Cost: HMR2 (ViT-Huge + SMPL-head) forward+backward runs every step — dramatically slower than the cached
# path (that's why features are cached). Keep the batch small; grad-checkpointing is a later lever.
defaults:
    - override /data: mocap/trainX_testY
    - override /model: gvhmr/gvhmr_pl
    - override /endecoder: gvhmr/v1_amass_local_bedlam_cam
    - override /optimizer: adamw_2e-4
    - override /scheduler_cfg: epoch_half_200_350
    - override /train_datasets:
          - imgfeat_3dpw/v1_crops
    - override /test_datasets:
          - emdb1/v1_fliptest
          - emdb2/v1_fliptest
          - 3dpw/fliptest
    - override /callbacks:
          - simple_ckpt_saver/every10e_top100
          - prog_bar/prog_reporter_every0.1
          - train_speed_timer/base
          - lr_monitor/pl
          - metric_emdb1
          - metric_emdb2
          - metric_3dpw
    - override /network: gvhmr/relative_transformer
    - override /logger: wandb

exp_name_base: joint_lora_3dpw
exp_name_var: ""
exp_name: ${exp_name_base}${exp_name_var}
data_name: mocap_joint_3dpw_v1

pipeline:
    _target_: gvhmr.model.gvhmr.pipeline.gvhmr_pipeline.Pipeline
    args_denoiser3d: ${network}
    args:
        endecoder_opt: ${endecoder}
        normalize_cam_angvel: True
        weights:
            cr_j3d: 500.
            transl_c: 1.
            cr_verts: 500.
            j2d: 1000.
            verts2d: 1000.
            transl_w: 1.
            static_conf_bce: 1.
        static_conf:
            vel_thr: 0.15

        # --- Regime B: the in-loop LoRA backbone. enabled=False -> byte-identical cached-feature path. ---
        joint_backbone:
            enabled: True
            rank: 8
            alpha: 16.0
            dropout: 0.0

data:
    loader_opts:
        train:
            batch_size: 8 # small: ViT-Huge fwd+bwd on B*L crops/step. Raise as memory allows.
            num_workers: 8

pl_trainer:
    precision: 16-mixed
    log_every_n_steps: 50
    gradient_clip_val: 0.5
    max_epochs: 100
    check_val_every_n_epoch: 10
    devices: 1
