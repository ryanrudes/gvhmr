# @package _global_
# ROADMAP Regime B stage 3 — the FROZEN baseline arm for the joint-backbone A/B.
#
# Identical to joint_lora_3dpw.yaml in every way EXCEPT: the backbone is not trained — cached HMR2
# features (imgfeat_3dpw/v1), joint_backbone disabled. Same data (3DPW-train only), same recipe, same
# seed → the ONLY difference from the joint arm is whether the backbone learns the task. LoRA is zero-init,
# so the joint arm starts numerically identical to this one; any benchmark gap at the end is attributable
# to backbone training alone. This is the controlled control.
defaults:
    - override /data: mocap/trainX_testY
    - override /model: gvhmr/gvhmr_pl
    - override /endecoder: gvhmr/v1_amass_local_bedlam_cam
    - override /optimizer: adamw_2e-4
    - override /scheduler_cfg: epoch_half_200_350
    - override /train_datasets:
          - imgfeat_3dpw/v1 # cached HMR2 features (NOT crops)
    - override /test_datasets:
          - emdb1/v1_fliptest
          - emdb2/v1_fliptest
          - 3dpw/fliptest
    - override /callbacks:
          - simple_ckpt_saver/every10e_top100
          - prog_bar/prog_reporter_every0.1
          - train_speed_timer/base
          - lr_monitor/pl
          - metric_emdb1
          - metric_emdb2
          - metric_3dpw
    - override /network: gvhmr/relative_transformer
    - override /logger: wandb

exp_name_base: joint_lora_3dpw_frozen
exp_name_var: ""
exp_name: ${exp_name_base}${exp_name_var}
data_name: mocap_joint_3dpw_v1

pipeline:
    _target_: gvhmr.model.gvhmr.pipeline.gvhmr_pipeline.Pipeline
    args_denoiser3d: ${network}
    args:
        endecoder_opt: ${endecoder}
        normalize_cam_angvel: True
        weights:
            cr_j3d: 500.
            transl_c: 1.
            cr_verts: 500.
            j2d: 1000.
            verts2d: 1000.
            transl_w: 1.
            static_conf_bce: 1.
        static_conf:
            vel_thr: 0.15
        # joint_backbone deliberately absent -> the cached-feature path (byte-identical to the released
        # training). That IS the control.

data:
    loader_opts:
        train:
            batch_size: 8
            num_workers: 8

pl_trainer:
    precision: 16-mixed
    log_every_n_steps: 50
    gradient_clip_val: 0.5
    max_epochs: 100
    check_val_every_n_epoch: 10
    devices: 1
