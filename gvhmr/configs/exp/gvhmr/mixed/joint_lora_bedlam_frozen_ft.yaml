# @package _global_
# The FROZEN control for joint_lora_bedlam_ft.yaml (ROADMAP Regime B stage 3, take 3).
#
# Identical in every respect — same warm start (ckpt_path=<gvhmr_siga24_release.ckpt>), same LR (5e-5),
# same epochs, same batch, same seed, same data (BEDLAM maxspan60 + 3DPW-train) — EXCEPT that it reads the
# cached HMR2 features instead of decoding crops and running the ViT in-loop. No joint_backbone block.
#
# That is the whole A/B: at step 0 both models ARE the released checkpoint bit-for-bit (the ckpt holds only
# pipeline.denoiser3d.*; LoRA is zero-init), so any divergence is attributable to the backbone adapting.
#
# NOTE the datasets must pair exactly: v2_maxspan60 here against v2_maxspan60_crops there. Pairing a subset
# against a full-set control would measure the data, not the backbone.
defaults:
    - override /data: mocap/trainX_testY
    - override /model: gvhmr/gvhmr_pl
    - override /endecoder: gvhmr/v1_amass_local_bedlam_cam
    - override /optimizer: adamw_5e-5
    - override /scheduler_cfg: epoch_half_200_350
    - override /train_datasets:
          - imgfeat_bedlam/v2_maxspan60
          - imgfeat_3dpw/v1
    - override /test_datasets:
          - emdb1/v1_fliptest
          - emdb2/v1_fliptest
          - 3dpw/fliptest
    - override /callbacks:
          - simple_ckpt_saver/every1e_top100 # 4-epoch run: every10e would save NOTHING (see the saver)
          - prog_bar/prog_reporter_every0.1
          - train_speed_timer/base
          - lr_monitor/pl
          - metric_emdb1
          - metric_emdb2
          - metric_3dpw
    - override /network: gvhmr/relative_transformer
    - override /logger: wandb

exp_name_base: joint_lora_bedlam_frozen_ft
exp_name_var: ""
exp_name: ${exp_name_base}${exp_name_var}
data_name: mocap_joint_bedlam_v1

pipeline:
    _target_: gvhmr.model.gvhmr.pipeline.gvhmr_pipeline.Pipeline
    args_denoiser3d: ${network}
    args:
        endecoder_opt: ${endecoder}
        normalize_cam_angvel: True
        weights:
            cr_j3d: 500.
            transl_c: 1.
            cr_verts: 500.
            j2d: 1000.
            verts2d: 1000.
            transl_w: 1.
            static_conf_bce: 1.
        static_conf:
            vel_thr: 0.15
        # No joint_backbone: cached features, backbone frozen. This is the control.

data:
    loader_opts:
        train:
            # Matched to the joint arm, NOT tuned for this one. This arm reads cached features and could
            # take a far larger batch, but the A/B requires identical optimizer steps and batch composition.
            batch_size: 2
            num_workers: 8

pl_trainer:
    precision: 16-mixed
    log_every_n_steps: 50
    gradient_clip_val: 0.5
    accumulate_grad_batches: 4 # effective batch 8 — matched to the joint arm
    max_epochs: 4
    check_val_every_n_epoch: 2
    devices: 1
