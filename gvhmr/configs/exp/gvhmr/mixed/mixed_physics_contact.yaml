# @package _global_
# ROADMAP A3 ablation — CONTACT terms only (foot_slide + penetration), transl_w_accel gated OFF.
# The mirror image of `mixed_physics_vel`, and the arm the vel result pointed straight at.
#
# What we now know (docs/ROADMAP.md A3), each arm vs the physics-off baseline:
#   light (all 3)         jitter −10..13%  ✓   but EMDB-2 W-MPJPE +6.97, RICH MPJPE +0.6, EMDB-1 MPJPE +2.34
#   vel   (accel only)    jitter ≈0        ✗   and EMDB-2 W-MPJPE +17.9, RTE +0.20, RICH MPJPE +3.6  (pure cost)
#
# By subtraction (light − vel) the jitter/accel win is carried ENTIRELY by foot_slide + penetration,
# and transl_w_accel is the harm. This arm keeps ONLY the two contact terms, at the `light` weights —
# a clean subtraction from `light` in the opposite direction to `vel`.
#
# Hypothesis: this arm keeps ~all of light's jitter win while shedding the chunk of the world/pose
# regression that vel showed was transl_w_accel's (≈ the +17.9 − +6.97 = +11mm of extra EMDB-2 W-MPJPE
# that the velocity term alone contributed). If so, THIS is the physics recipe that is not a pure trade.
defaults:
    - override /data: mocap/trainX_testY
    - override /model: gvhmr/gvhmr_pl
    - override /endecoder: gvhmr/v1_amass_local_bedlam_cam
    - override /optimizer: adamw_2e-4
    - override /scheduler_cfg: epoch_half_200_350
    - override /train_datasets:
          - pure_motion_amass/v11
          - imgfeat_bedlam/v2
          - imgfeat_h36m/v1
          - imgfeat_3dpw/v1
    - override /test_datasets:
          - emdb1/v1_fliptest
          - emdb2/v1_fliptest
          - rich/all
          - 3dpw/fliptest
    - override /callbacks:
          - simple_ckpt_saver/every10e_top100
          - prog_bar/prog_reporter_every0.1
          - train_speed_timer/base
          - lr_monitor/pl
          - metric_emdb1
          - metric_emdb2
          - metric_rich
          - metric_3dpw
    - override /network: gvhmr/relative_transformer
    - override /logger: wandb

exp_name_base: mixed_physics_contact
exp_name_var: ""
exp_name: ${exp_name_base}${exp_name_var}
data_name: mocap_mixed_v1

pipeline:
    _target_: gvhmr.model.gvhmr.pipeline.gvhmr_pipeline.Pipeline
    args_denoiser3d: ${network}
    args:
        endecoder_opt: ${endecoder}
        normalize_cam_angvel: True
        weights:
            cr_j3d: 500.
            transl_c: 1.
            cr_verts: 500.
            j2d: 1000.
            verts2d: 1000.

            transl_w: 1.
            static_conf_bce: 1.

            # --- A3 ablation: contact terms ONLY (same weights as the `light` arm) ---
            foot_slide: 200. # foot_contact_loss
            penetration: 100. # ground_penetration_loss
            # transl_w_accel deliberately absent (=> 0, gated off) — that IS the ablation.

        static_conf:
            vel_thr: 0.15

data:
    loader_opts:
        train:
            batch_size: 128
            num_workers: 12

pl_trainer:
    precision: 16-mixed
    log_every_n_steps: 50
    gradient_clip_val: 0.5
    max_epochs: 500
    check_val_every_n_epoch: 10
    devices: 2
