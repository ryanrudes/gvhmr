# Person detector/tracker — ultralytics YOLO. This is the released default (= yolov8x). Every YOLO family ×
# size is available as its own preset (yolov8/9/10/11/12/26 {n,s,m,l,x}); `gvhmr config` lists them, and
# any other/newer weight works via `--detector-ckpt <name>.pt`. Keys below are ctor kwargs; `null` ⇒ default.
name: yolo
ckpt: null # null → the released yolov8x.pt (assets.YOLO_CKPT); or a path / an ultralytics weight name
conf: 0.5 # detection confidence (ultralytics default 0.25; GVHMR/WHAM use 0.5)
