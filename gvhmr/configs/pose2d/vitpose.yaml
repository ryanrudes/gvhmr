# 2D keypoints — ViTPose-Huge (the released default). Emits COCO-17 (F,17,3), the skeleton the trained
# network asserts (relative_transformer.py). Any estimator emitting COCO-17 can replace it (see the
# pose2d group). Keys below are ctor kwargs; `null` ⇒ the ctor default.
name: vitpose
ckpt_path: null # null → the released vitpose-h checkpoint (assets.VITPOSE_CKPT)
model_name: ViTPose_huge_coco_256x192
flip_test: false # ViTPose TTA (input + its mirror): ~2x slower, small kp2d-accuracy gain. Off for speed.
batch_size: 32 # frames per forward; bf16 (auto on CUDA) halves memory, so raise this on a big card
