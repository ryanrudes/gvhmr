defaults:
  - _self_
  - model: gvhmr/gvhmr_pl_demo
  - network: gvhmr/relative_transformer
  - endecoder: gvhmr/v1_amass_local_bedlam_cam
  # Pluggable preprocessing stages (Tier A) — each a config group you can swap by name
  # (gvhmr demo … --detector/--pose2d/--backbone) or override in a --recipe. Defaults are the
  # released models, so composition stays byte-identical. See docs/EXTENSIBILITY.md.
  - detector: yolo
  - pose2d: vitpose
  - backbone: hmr2
  - camera: simplevo

pipeline:
  _target_: gvhmr.model.gvhmr.pipeline.gvhmr_pipeline.Pipeline
  args_denoiser3d: ${network}
  args:
    endecoder_opt: ${endecoder}
    normalize_cam_angvel: True
    weights: null
    static_conf: null

# Resolves through gvhmr.utils.assets (env var > config file > default) — see register_store_gvhmr.
ckpt_path: ${gvhmr_checkpoints:}/gvhmr/gvhmr_siga24_release.ckpt

# ================================ #
#          global setting          #
# ================================ #

video_name: ???
output_root: outputs/demo
output_dir: "${output_root}/${video_name}"
preprocess_dir: ${output_dir}/preprocess
video_path: "${output_dir}/0_input_video.mp4"

# Options
static_cam: False
verbose: False
use_dpvo: False
box_adapt: null  # detector box-distribution adapter (A4): {scale, dx, dy} to match the released framing; null = identity
flip_test: False  # mirror-averaging TTA (benchmark accuracy; +1 feature pass). A recipe can turn it on.
f_mm: null  # focal length of fullframe camera in mm
f_px: null  # focal length in pixels (bypasses the mm→px conversion; overrides f_mm)
intrinsics_path: null  # JSON/NPZ intrinsics sidecar (fx/fy/cx/cy or K; per-frame ok) — highest precedence
render_scale: 0.5  # rasterize the overlay videos at this fraction of full resolution (speed vs. quality)

paths:
  bbx: ${preprocess_dir}/bbx.pt
  bbx_xyxy_video_overlay: ${preprocess_dir}/bbx_xyxy_video_overlay.mp4
  vit_features: ${preprocess_dir}/vit_features.pt
  vitpose: ${preprocess_dir}/vitpose.pt
  vitpose_video_overlay: ${preprocess_dir}/vitpose_video_overlay.mp4
  hmr4d_results: ${output_dir}/hmr4d_results.pt
  incam_video: ${output_dir}/1_incam.mp4
  global_video: ${output_dir}/2_global.mp4
  incam_global_horiz_video: ${output_dir}/${video_name}_3_incam_global_horiz.mp4
  slam: ${preprocess_dir}/slam_results.pt
