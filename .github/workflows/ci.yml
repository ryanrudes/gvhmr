name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate: format must be clean and the CPU characterization suite must pass on every
  # supported Python; the wheel must build. Kept lean so advisory checks can't hold it up.
  test:
    name: test (CPU, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync (base + dev)
        run: uv sync --extra dev --python ${{ matrix.python-version }}
      - name: Ruff (format check)
        run: uv run ruff format --check gvhmr tools tests
      - name: Pytest (CPU characterization suite)
        run: uv run pytest -q
      - name: Build wheel
        run: uv build --wheel

  # Advisory only — never gates the build (typing/lint pass is still landing). Runs once, with
  # a hard timeout so a slow type-check can't stall CI (pyright is scoped via pyrightconfig.json).
  lint:
    name: lint + types (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync (base + dev)
        run: uv sync --extra dev
      - name: Ruff (lint)
        run: uv run ruff check gvhmr tools tests
        continue-on-error: true  # advisory: reported, but the check stays green while the lint pass lands
      - name: Pyright (type-check)
        timeout-minutes: 6
        run: uv run pyright
        continue-on-error: true  # advisory (and a slow/timed-out type-check can't redden the check)
