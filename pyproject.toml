[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gvhmr"
version = "1.0.3"
description = "GVHMR: World-Grounded Human Motion Recovery via Gravity-View Coordinates (training & inference)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Zehong Shen" }]
maintainers = [{ name = "Ryan Rudes" }]
keywords = ["human-motion-recovery", "smpl", "pose-estimation", "pytorch", "siggraph"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Base install: enough to import the package, compose configs, build/run the
# GVHMR network on CPU/MPS, do video IO, and run the test suite. Installs cleanly
# on macOS (Apple Silicon, CPU/MPS) with `uv sync`. Heavy/platform-specific pieces
# (rendering, preprocessing models, SLAM) live in the optional extras below.
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "huggingface_hub>=0.23",  # from_pretrained / push_to_hub + checkpoint downloads (gvhmr.inference.hub)
    "requests>=2.28",  # credentialed body-model fetch from the MPI portal (gvhmr.utils.mpi_download)
    "numpy>=1.26",
    "scipy>=1.11",
    "einops>=0.8",
    "omegaconf>=2.3",
    "hydra-core>=1.3",
    "hydra-zen>=0.13",
    "hydra-colorlog>=1.2",
    "pytorch-lightning>=2.3",
    "rich>=13",
    "typer>=0.12",
    "termcolor",
    "tqdm",
    "timm>=1.0.9",
    "imageio>=2.34",
    "moderngl>=5.10",  # fast GPU overlay renderer (Metal/OpenGL); real-time, no pytorch3d needed
    "av>=12",
    "opencv-python>=4.9",
    "ffmpeg-python",
    "scikit-image",
    "joblib",
    "trimesh",
    "matplotlib",
    "smplx>=0.1.28",
    "chumpy",  # loads legacy SMPL .pkl body models (see gvhmr/utils/_smpl_compat.py)
]

[project.optional-dependencies]
# 2D detection / pose / camera preprocessing (per-video). `pycolmap` powers the
# default SimpleVO and ships macOS wheels; YOLO + trackers need their own weights.
preproc = ["ultralytics>=8.2", "cython_bbox", "lapx", "pycolmap>=0.6", "yacs"]

# Alternative 2D-pose backend: RTMPose via rtmlib on ONNXRuntime (ungated, no mmcv). `--pose2d rtmpose`.
# CPU/Apple-Silicon by default; on a CUDA box swap `onnxruntime` → `onnxruntime-gpu` for the GPU EP.
rtmpose = ["rtmlib", "onnxruntime"]

# Gradio demo app — `gvhmr.pipeline` behind a browser UI (upload a video → overlay + npz). Same code as
# the HuggingFace Space under space/. `pip install gvhmr[app,preproc]` then `python space/app.py`.
app = ["gradio>=4"]

# Interactive 3D visualization / research debugging.
vis = ["wis3d", "viser"]

# Notebooks and interactive debugging.
notebook = ["jupyter", "ipython", "ipdb"]

# Developer tooling: tests, lint/format, type-checking.
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "ipdb",
    "pre-commit",  # git hooks (auto-runs `ruff format` — see .pre-commit-config.yaml); `make hooks`
]

# Mesh rendering (overlay videos). pytorch3d has no general PyPI wheel for recent torch, so it
# is built from source from git — declared here (with build isolation disabled, see [tool.uv]
# below) so `uv sync --extra render` installs it and a later `uv sync` never prunes it.
render = ["pytorch3d"]

# Experiment logging for `gvhmr train`: Weights & Biases (the default logger, `logger=wandb`) plus
# TensorBoard (the alt, `logger=tensorboard`). W&B is offline-capable (`export WANDB_MODE=offline`,
# logs under <output_dir>/wandb/); otherwise run `wandb login` once to stream online.
# wandb-workspaces powers `gvhmr sweep`'s auto-generated comparison report (parallel coords + charts).
train = ["wandb>=0.17", "tensorboard", "wandb-workspaces"]

# DPVO's torch-ABI-FREE runtime deps. The compiled pieces (dpvo itself + torch-scatter) are CUDA-only
# and built out-of-band by scripts/setup_dpvo.sh — but these are ordinary wheels, and locking them lets
# uv own their constraints (notably numba's numpy cap) so a later sync can't break a DPVO install by
# floating numpy past what numba supports. `gvhmr env sync` adds this extra automatically when the
# recorded env has dpvo=true.
dpvo = ["numba", "pypose"]

# --- PyTorch CUDA backend (Linux): pick the one matching your GPU ---------------------------------
# uv can't auto-detect the GPU for `uv sync` (`--torch-backend=auto` is uv-pip-only) and a lockfile
# can't gate wheels on CUDA version (no marker exists), so the CUDA build is an explicit, mutually-
# exclusive choice. Check `nvidia-smi` ("CUDA Version: X.Y") and sync the nearest extra <= X.Y:
#     uv sync --extra cu128                 # a CUDA 12.8 box
#     uv sync --extra cu128 --extra preproc # combine with other extras as usual
# macOS / plain `uv sync` (no cuXXX extra) uses the PyPI wheel = Apple-Silicon MPS — don't add a cuXXX
# extra on a Mac. `cpu` forces the CPU build (handy for CI or a GPU-less Linux box). These extras are
# mutually exclusive (see [tool.uv] conflicts); each routes torch/torchvision to a PyTorch index.
#
# The CUDA extras are pinned to torch < 2.8: newer wheels (>= 2.8) depend on a separate
# `nvidia-nvshmem-cu12` package that their RPATH fails to locate ("libnvshmem_host.so.3: cannot open
# shared object file"), so they don't import. torch 2.7.x predates that and is rock-solid. CUDA wheels
# are forward/back compatible across the driver line, so cu128 also covers CUDA 13.x boxes — no cu130
# extra needed. (cpu floats to the latest; it has no nvshmem dependency.)
cpu = ["torch", "torchvision"]
cu124 = ["torch>=2.4,<2.8", "torchvision>=0.19,<0.23"]
cu126 = ["torch>=2.4,<2.8", "torchvision>=0.19,<0.23"]
cu128 = ["torch>=2.4,<2.8", "torchvision>=0.19,<0.23"]

# NOTE: DPVO (CUDA-only SLAM) is installed by `scripts/setup_dpvo.sh`, not a uv extra — it compiles CUDA
# extensions from a thin Eigen-vendored fork against the selected torch. The script picks the CUDA extra
# for you. On Mac/MPS (no DPVO) use `gvhmr demo --camera dust3r` (or `--camera vggt`).

[project.scripts]
gvhmr = "gvhmr.cli:app"

[project.urls]
Homepage = "https://zju3dv.github.io/gvhmr"
Repository = "https://github.com/ryanrudes/gvhmr"
Upstream = "https://github.com/zju3dv/GVHMR"
Paper = "https://arxiv.org/abs/2409.06662"

# ---------------------------------------------------------------------------
# uv: build pytorch3d (the `render` extra) from source against the installed torch
# ---------------------------------------------------------------------------
[tool.uv]
# pytorch3d's build imports torch, so it must build in the project env (not an isolated one).
no-build-isolation-package = ["pytorch3d"]
# The PyTorch CUDA-backend extras are mutually exclusive — only one torch build at a time.
conflicts = [[
    { extra = "cpu" },
    { extra = "cu124" },
    { extra = "cu126" },
    { extra = "cu128" },
]]

# chumpy's legacy setup.py imports `pip` at build time but doesn't declare it as a build dependency,
# so its isolated build env needs pip added explicitly (otherwise `uv sync` fails on clean CI runners).
# pytorch3d's legacy setup.py likewise needs setuptools when uv refreshes the git source (e.g. after a
# version bump desyncs uv.lock from pyproject.toml and triggers a re-lock on CI).
[tool.uv.extra-build-dependencies]
chumpy = ["pip"]
pytorch3d = ["setuptools"]

# PyTorch wheel indexes, one per backend; `explicit = true` means a package only resolves here when a
# source below points to it (so non-torch packages still come from PyPI). Selected via the cuXXX/cpu
# extras above. No marker here — the *extra* gates each (and the extras are Linux-only in practice;
# don't enable one on macOS, which uses the default PyPI MPS wheel).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu124", extra = "cu124" },
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu128", extra = "cu128" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu124", extra = "cu124" },
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu128", extra = "cu128" },
]
# No PyPI wheel for recent torch — build from git. uv pins the resolved commit in uv.lock.
pytorch3d = { git = "https://github.com/facebookresearch/pytorch3d.git", rev = "c8fcd83ff96fa0a5893c0b994f9285d7aa772540" }
# (DPVO is not declared here — it's CUDA-only and installed out-of-band by scripts/setup_dpvo.sh.)

# ---------------------------------------------------------------------------
# Build backend (hatchling)
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
# Ships the whole package, including committed model-data assets
# (*.pt/*.pth/*.npz/*.npy) and Hydra *.yaml configs under gvhmr/.
packages = ["gvhmr"]

[tool.hatch.build.targets.sdist]
include = ["gvhmr", "tools", "docs", "tests", "space", "README.md", "LICENSE"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    "gvhmr/utils/preproc/vitpose_pytorch",  # vendored (ViTPose) — frozen
    "gvhmr/network/hmr2",                    # vendored (4D-Humans/HMR2.0) — frozen
    "third-party",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function call in default arg (hydra-zen builds pattern)
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]  # re-exports
"gvhmr/configs/store_gvhmr.py" = ["F401"]  # import-for-side-effect registration

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "gpu: requires a CUDA/MPS device",
    "checkpoint: requires released model checkpoints",
    "dataset: requires preprocessed datasets",
    "pytorch3d: requires the pytorch3d package",
]

[tool.pyright]
include = ["gvhmr", "tools", "tests"]
exclude = [
    "**/__pycache__",
    "gvhmr/utils/preproc/vitpose_pytorch",  # vendored — frozen
    "gvhmr/network/hmr2",                    # vendored — frozen
    "inputs",
    "outputs",
]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = "warning"
